<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>World Nation</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#111827;
    color:#f3f4f6;
    font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

#startScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.startBox{
    width:min(500px,100%);
    background:#1f2937;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 50px #0008;
}

.startBox h1{
    text-align:center;
    margin-top:0;
}

.startBox input{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    margin:10px 0;
    background:#374151;
    color:white;
}

.startBox button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

#game{
    display:none;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#0f172a;
    border-bottom:1px solid #374151;
    padding:10px;
}

.headerTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

#nationTitle{
    font-size:20px;
    font-weight:bold;
}

.speed button{
    padding:6px 9px;
    border:0;
    border-radius:7px;
    background:#374151;
    color:white;
}

.speed button.active{
    background:#2563eb;
}

nav{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding-top:10px;
}

nav button{
    white-space:nowrap;
    border:0;
    border-radius:8px;
    padding:8px 12px;
    background:#374151;
    color:white;
}

nav button.active{
    background:#2563eb;
}

main{
    max-width:1200px;
    margin:auto;
    padding:12px;
}

.panel{
    background:#1f2937;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
}

.panel h2,
.panel h3{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

.card{
    background:#111827;
    border-radius:10px;
    padding:12px;
}

.card strong{
    display:block;
    font-size:18px;
    margin-top:4px;
}

.resource{
    display:flex;
    justify-content:space-between;
    gap:5px;
    padding:7px 0;
    border-bottom:1px solid #374151;
}

.resource:last-child{
    border-bottom:0;
}

.buildGrid,
.factoryGrid,
.tradeGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.buildCard{
    background:#111827;
    border-radius:12px;
    padding:13px;
}

.buildCard button{
    width:100%;
    margin-top:8px;
    padding:9px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
}

.buildCard button:disabled{
    background:#4b5563;
    cursor:not-allowed;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:6px;
    background:#374151;
    font-size:12px;
}

.good{
    color:#86efac;
}

.bad{
    color:#fca5a5;
}

.warning{
    color:#fde68a;
}

.log{
    max-height:250px;
    overflow-y:auto;
    background:#111827;
    padding:10px;
    border-radius:10px;
}

.log div{
    padding:5px;
    border-bottom:1px solid #374151;
    font-size:13px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    border-bottom:1px solid #374151;
    text-align:left;
}

select,
.tradeGrid input{
    width:100%;
    padding:8px;
    border:0;
    border-radius:7px;
    background:#374151;
    color:white;
}

.tradeGrid button{
    width:100%;
    padding:9px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    margin-top:5px;
}

.progress{
    height:10px;
    background:#374151;
    border-radius:10px;
    overflow:hidden;
}

.progress div{
    height:100%;
    background:#3b82f6;
}

.hidden{
    display:none;
}

.small{
    font-size:13px;
    color:#9ca3af;
}

@media(max-width:600px){
    .headerTop{
        align-items:flex-start;
    }

    #nationTitle{
        font-size:17px;
    }

    main{
        padding:8px;
    }

    .panel{
        padding:12px;
    }

    th,td{
        font-size:12px;
        padding:6px;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <h1>🌍 WORLD NATION</h1>
        <p>나만의 국가를 만들고 세계 경제를 발전시켜라.</p>

        <input id="nationNameInput" placeholder="국가 이름">

        <p class="small">
            시작 환경은 5가지 환경 중 무작위로 결정됩니다.
        </p>

        <button onclick="startGame()">국가 건설 시작</button>
    </div>
</div>

<div id="game">

<header>
    <div class="headerTop">
        <div>
            <div id="nationTitle"></div>
            <div class="small" id="dateText"></div>
        </div>

        <div class="speed">
            <button onclick="setSpeed(1)" id="speed1">×1</button>
            <button onclick="setSpeed(2)" id="speed2">×2</button>
            <button onclick="setSpeed(3)" id="speed3">×3</button>
            <button onclick="setSpeed(4)" id="speed4">×4</button>
        </div>
    </div>

    <nav>
        <button onclick="showTab('overview')" class="active">국가</button>
        <button onclick="showTab('resources')">자원</button>
        <button onclick="showTab('build')">건설</button>
        <button onclick="showTab('factory')">공장</button>
        <button onclick="showTab('trade')">무역</button>
        <button onclick="showTab('market')">시장</button>
        <button onclick="showTab('world')">세계</button>
        <button onclick="showTab('logTab')">로그</button>
    </nav>
</header>

<main>

<!-- 국가 -->
<section id="overview" class="tab">

<div class="panel">
    <h2>🏛️ 국가 정보</h2>

    <div class="grid">
        <div class="card">
            국가
            <strong id="countryName"></strong>
        </div>

        <div class="card">
            환경
            <strong id="environment"></strong>
        </div>

        <div class="card">
            발전 단계
            <strong id="level"></strong>
        </div>

        <div class="card">
            인구
            <strong id="population"></strong>
        </div>

        <div class="card">
            국고
            <strong id="money"></strong>
        </div>

        <div class="card">
            전력
            <strong id="power"></strong>
        </div>
    </div>
</div>

<div class="panel">
    <h2>📈 다음 발전 단계</h2>

    <div id="levelRequirement"></div>

    <div class="progress">
        <div id="levelProgress"></div>
    </div>
</div>

<div class="panel">
    <h2>👷 노동력</h2>
    <div id="workers"></div>
</div>

<div class="panel">
    <h2>🏗️ 건물 현황</h2>
    <div id="buildingSummary" class="grid"></div>
</div>

</section>


<!-- 자원 -->
<section id="resources" class="tab hidden">

<div class="panel">
    <h2>📦 국가 자원</h2>
    <div id="resourceList"></div>
</div>

<div class="panel">
    <h2>📊 하루 생산 / 소비</h2>
    <div id="dailyBalance"></div>
</div>

</section>


<!-- 건설 -->
<section id="build" class="tab hidden">

<div class="panel">
    <h2>🏗️ 건물 건설</h2>
    <p class="small">
        건물은 건설비용을 지불한 뒤 국가의 생산능력을 증가시킵니다.
    </p>

    <div id="buildingList" class="buildGrid"></div>
</div>

</section>


<!-- 공장 -->
<section id="factory" class="tab hidden">

<div class="panel">
    <h2>🏭 공장 생산</h2>
    <div id="factoryList" class="factoryGrid"></div>
</div>

</section>


<!-- 무역 -->
<section id="trade" class="tab hidden">

<div class="panel">
    <h2>🚢 국가 간 무역</h2>

    <div id="tradeList"></div>
</div>

</section>


<!-- 시장 -->
<section id="market" class="tab hidden">

<div class="panel">
    <h2>🌐 세계시장</h2>

    <table>
        <thead>
            <tr>
                <th>자원</th>
                <th>가격</th>
                <th>시장상태</th>
            </tr>
        </thead>

        <tbody id="marketTable"></tbody>
    </table>
</div>

</section>


<!-- 세계 -->
<section id="world" class="tab hidden">

<div class="panel">
    <h2>🌎 세계 국가</h2>

    <div id="worldList"></div>
</div>

</section>


<!-- 로그 -->
<section id="logTab" class="tab hidden">

<div class="panel">
    <h2>📜 국가 기록</h2>
    <div id="log" class="log"></div>
</div>

</section>

</main>
</div>

/* =====================================================
   게임 상태
===================================================== */

let game = null;
let timer = null;

let speed = 1;

let gameMinutes = 0;

const MAX_STORAGE = 10000;


/* =====================================================
   국가 생성
===================================================== */

function startGame(){

    let name =
        document.getElementById("nationNameInput").value.trim();

    if(!name){
        name = "신생국";
    }

    const envNames =
        Object.keys(environments);

    const environment =
        envNames[Math.floor(Math.random()*envNames.length)];

    const initial = {

        food:2500,
        water:3000,
        wood:700,
        stone:1000,

        ironOre:400,
        copperOre:150,
        coal:200,

        oil:100,
        gas:100,

        rare:50,
        fiber:100,

        iron:0,
        copper:0,
        processedWood:0,

        fuel:0,
        chemical:0,

        foodProduct:0,
        clothes:0,
        furniture:0,
        tools:0,
        valuables:0
    };

    const env = environments[environment];

    /*
       환경별 초기 재고
    */

    const starting = {

        "초원":{
            food:2500,water:3000,wood:700,stone:1000,
            ironOre:400,copperOre:150,coal:200,
            oil:100,gas:100,rare:50
        },

        "정글":{
            food:1200,water:4000,wood:3500,stone:800,
            ironOre:500,copperOre:300,coal:300,
            oil:200,gas:200,rare:150
        },

        "사막":{
            food:400,water:500,wood:150,stone:2000,
            ironOre:1200,copperOre:800,coal:500,
            oil:2500,gas:1500,rare:500
        },

        "설원":{
            food:300,water:2000,wood:400,stone:1500,
            ironOre:1500,copperOre:700,coal:1800,
            oil:1500,gas:1200,rare:400
        },

        "산악숲":{
            food:800,water:2500,wood:3000,stone:2500,
            ironOre:3000,copperOre:1500,coal:1500,
            oil:300,gas:200,rare:800
        }

    }[environment];

    Object.assign(initial,starting);

    game = {

        name,
        environment,

        money:10000,

        population:100,

        level:1,

        resources:initial,

        buildings:{},

        countries:[],

        market:{},

        logs:[],

        technology:1,

        tradeHistory:[]

    };

    /*
       건물 초기화
    */

    Object.keys(buildingData).forEach(k=>{
        game.buildings[k]=0;
    });


    /*
       AI 국가
    */

    createAI();


    /*
       시장
    */

    Object.keys(resourceInfo).forEach(k=>{
        game.market[k]=resourceInfo[k].price;
    });


    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    addLog(
        `국가 ${name}이(가) ${environment}에서 시작했습니다.`
    );

    addLog(
        "세계에는 4개의 AI 국가가 존재합니다."
    );

    setSpeed(1);

    updateUI();

    if(timer) clearInterval(timer);

    timer=setInterval(gameTick,1000);
}

                well:1,

/* =====================================================
   시간
===================================================== */

function gameTick(){

    for(let i=0;i<speed;i++){

        gameMinutes++;

        productionTick();

        factoryTick();

        consumptionTick();

        populationTick();

        aiTick();

        marketTick();

        levelCheck();

        if(gameMinutes % 60 === 0){
            randomEvent();
        }
    }

    updateUI();
}


/* =====================================================
   생산
===================================================== */

function productionTick(){

    const env=environments[game.environment];

    let usedWorkers=0;

    Object.entries(game.buildings).forEach(([key,count])=>{

        if(!count) return;

        const b=buildingData[key];

        if(!b.production) return;

        usedWorkers += b.workers * count;

        Object.entries(b.production).forEach(([resource,base])=>{

            let amount =
                base *
                count *
                envFactor(resource,env);

            amount *=
                Math.min(
                    1,
                    availableWorkers() /
                    Math.max(1,usedWorkers)
                );

            addResource(resource,amount);

        });

    });

}


/* =====================================================
   환경 생산 보정
===================================================== */

function envFactor(resource,env){

    const map={

        food:"food",
        water:"water",
        wood:"wood",
        stone:"stone",

        ironOre:"iron",
        copperOre:"copperOre",

        coal:"coal",

        oil:"oil",
        gas:"gas",

        rare:"rare",

        fiber:"food"

    };

    return environments[game.environment][
        map[resource] || resource
    ] || 1;

}


/* =====================================================
   공장
===================================================== */

function factoryTick(){

    Object.entries(game.buildings).forEach(([key,count])=>{

        if(!count) return;

        const b=buildingData[key];

        if(!b.recipe) return;

        const workers =
            b.workers * count;

        if(availableWorkers() < workers){
            return;
        }

        let possible=count;

        Object.entries(b.recipe.input).forEach(([r,cost])=>{

            possible=Math.min(
                possible,
                Math.floor(
                    (game.resources[r]||0) / cost
                )
            );

        });

        if(possible<=0) return;

        Object.entries(b.recipe.input).forEach(([r,cost])=>{
            game.resources[r]-=cost*possible;
        });

        Object.entries(b.recipe.output).forEach(([r,amount])=>{
            addResource(r,amount*possible);
        });

    });

}


/* =====================================================
   소비
===================================================== */

function consumptionTick(){

    const pop=game.population;

    /*
       식량 소비
       0.08개 / 인 / 일
       1분 = 1일
    */

    game.resources.food -= pop * 0.08;

    /*
       물
    */

    game.resources.water -= pop * 0.15;

    /*
       제품 소비
    */

    game.resources.foodProduct -=
        pop * 0.03;

    game.resources.clothes -=
        pop * 0.005;

    /*
       전력은 별도 계산
    */

    if(game.resources.food < 0){

        game.resources.food=0;

        game.population -=
            Math.max(0.1,pop*0.01);

        addLog("⚠️ 식량 부족으로 인구가 감소했습니다.");

    }

    if(game.resources.water < 0){

        game.resources.water=0;

        game.population -=
            Math.max(0.1,pop*0.01);

        addLog("⚠️ 물 부족으로 인구가 감소했습니다.");

    }

    if(game.population<10){
        game.population=10;
    }

}


/* =====================================================
   인구
===================================================== */

function populationTick(){

    let food=game.resources.food;

    if(food > game.population * 2){

        game.population +=
            game.population * 0.0008;

    }

}


/* =====================================================
   노동력
===================================================== */

function availableWorkers(){

    return game.population * 0.60;
}


/* =====================================================
   자원 추가
===================================================== */

function addResource(resource,amount){

    if(!game.resources[resource]){
        game.resources[resource]=0;
    }

    game.resources[resource]+=amount;

    if(game.resources[resource]>MAX_STORAGE){

        game.resources[resource]=MAX_STORAGE;

    }

    if(game.resources[resource]<0){
        game.resources[resource]=0;
    }

}


/* =====================================================
   건설
===================================================== */

function build(key){

    const b=buildingData[key];

    if(!b) return;

    if(game.level < requiredLevel(key)){

        addLog(
            `🔒 ${b.name}은(는) 발전 단계가 부족합니다.`
        );

        return;
    }

    if(!payCost(b.cost)){

        addLog(
            `❌ ${b.name} 건설 자원이 부족합니다.`
        );

        return;
    }

    game.buildings[key]++;

    addLog(
        `🏗️ ${b.name}을(를) 건설했습니다.`
    );

    updateUI();

}


/* =====================================================
   건설 비용
===================================================== */

function payCost(cost){

    for(const [r,v] of Object.entries(cost)){

        if(r==="money"){

            if(game.money<v)
                return false;

        }else{

            if((game.resources[r]||0)<v)
                return false;

        }

    }

    for(const [r,v] of Object.entries(cost)){

        if(r==="money")
            game.money-=v;

        else
            game.resources[r]-=v;

    }

    return true;
}


/* =====================================================
   발전 조건
===================================================== */

function requiredLevel(key){

    const groups={

        farm:1,
        well:1,
        lumber:1,
        quarry:1,
        fiberFarm:2,

        ironMine:2,
        copperMine:2,
        coalMine:2,

        oilField:3,
        gasField:3,

        steelMill:3,
        copperFactory:3,
        woodFactory:3,

        foodFactory:4,
        textileFactory:4,
        furnitureFactory:4,

        refinery:5,
        chemicalFactory:5,
        metalFactory:5,

        valuableWorkshop:6

    };

    return groups[key]||1;
}

function levelCheck(){

    let next=game.level;

    for(let i=0;i<levels.length;i++){

        if(
            game.population >= levels[i].population &&
            i+1>next
        ){
            next=i+1;
        }

    }

    if(next>game.level){

        game.level=next;

        addLog(
            `🎉 국가가 ${levels[next-1].name} 단계로 발전했습니다!`
        );

/* =====================================================
   AI
===================================================== */

function aiTick(){

    game.countries.forEach(c=>{

        const env=environments[c.environment];

        /*
           간단한 AI 생산
        */

        c.resources.food =
            Math.min(
                10000,
                c.resources.food +
                (c.buildings.farm||0) *
                100 *
                env.food
            );

        c.resources.water =
            Math.min(
                10000,
                c.resources.water +
                (c.buildings.well||0) *
                100 *
                env.water
            );

        c.resources.wood =
            Math.min(
                10000,
                c.resources.wood +
                (c.buildings.lumber||0) *
                80 *
                env.wood
            );

        /*
           소비
        */

        c.resources.food -=
            c.population*0.08;

        c.resources.water -=
            c.population*0.15;

        if(c.resources.food<100){

            c.money-=100;

        }

        if(c.resources.water<100){

            c.money-=100;

        }

        /*
           AI 인구 성장
        */

        if(
            c.resources.food>c.population &&
            c.resources.water>c.population
        ){

            c.population +=
                c.population*0.0005;

        }

        /*
           AI 국가 무역
        */

        aiTrade(c);

    });

}


/* =====================================================
   AI 무역
===================================================== */

function aiTrade(c){

    if(c.money<500) return;

    if(c.resources.food<200){

        c.money-=200;

        c.resources.food+=20;

        addLog(
            `🤝 ${c.name}이(가) 세계시장에서 식량을 구매했습니다.`
        );

    }

    if(c.resources.water<200){

        c.money-=100;

        c.resources.water+=20;

    }

}

===================================================== */

function marketTick(){

    Object.keys(resourceInfo).forEach(resource=>{

        let change =
            (Math.random()-0.5)*0.08;

        game.market[resource] *=

        const base=resourceInfo[resource].price;

/* =====================================================
   무역
===================================================== */

function trade(countryIndex,type){

    const country=
        game.countries[countryIndex];

    const resource=
        document.getElementById(
            `tradeResource${countryIndex}`
        ).value;

    const amount=
        Number(
            document.getElementById(
                `tradeAmount${countryIndex}`
            ).value
        );

    const transport=
        document.getElementById(
            `transport${countryIndex}`
        ).value;

    if(!amount || amount<=0){

        addLog("❌ 거래 수량을 입력하세요.");

        return;
    }

    const price=
        game.market[resource] || resourceInfo[resource].price;

    const transportRate={

        land:1.15,
        sea:1.05,
        air:1.50

    }[transport];

    const total=
        amount*price*transportRate;

    if(type==="buy"){

        if(game.money<total){

            addLog("❌ 국고가 부족합니다.");

            return;
        }

        if(
            country.resources[resource]===undefined ||
            country.resources[resource]<amount
        ){

            addLog("❌ 상대 국가의 재고가 부족합니다.");

            return;
        }

        game.money-=total;

        country.money+=total;

        country.resources[resource]-=amount;

        addResource(resource,amount);

        addLog(
            `🚚 ${country.name}에서 ${resourceInfo[resource].name} ${format(amount)}${resourceInfo[resource].unit} 구매`
        );

    }

    else{

        if(
            (game.resources[resource]||0)<amount
        ){

            addLog("❌ 판매할 자원이 부족합니다.");

            return;
        }

        if(
            !country.resources[resource] &&
            country.resources[resource]!==0
        ){

            country.resources[resource]=0;

        }

        if(country.money<total){

            addLog("❌ 상대 국가의 국고가 부족합니다.");

            return;
        }

        game.resources[resource]-=amount;

        country.resources[resource]+=amount;

        game.money+=total;

        country.money-=total;

        addLog(
            `💰 ${country.name}에 ${resourceInfo[resource].name} ${format(amount)}${resourceInfo[resource].unit} 판매`
        );

    }

    game.tradeHistory.push({

        country:country.name,

        resource,

        amount,

        type,

        transport,

        money:total

    });

    updateUI();

}


/* =====================================================
   운송 해금
===================================================== */

function transportUnlocked(type){

    if(type==="land")
        return game.level>=1;

    if(type==="sea")
        return game.level>=3;

    if(type==="air")
        return game.level>=5;

    return false;
}

/* =====================================================
   전력
===================================================== */

function calculatePower(){

    let p=0;

    Object.entries(game.buildings).forEach(([key,count])=>{

        if(
            key.includes("Factory") ||
            key==="steelMill" ||
            key==="refinery" ||
            key==="chemicalFactory" ||
            key==="metalFactory" ||
            key==="valuableWorkshop"
        ){

            p+=count*20;

        }

    });

    return p;
}


/* =====================================================
   발전 UI
===================================================== */

function updateLevelUI(){

    const next=
        levels[game.level];

    if(!next){

        document.getElementById("levelRequirement").innerHTML=
            "<b>최고 발전 단계입니다.</b>";

        document.getElementById("levelProgress").style.width="100%";

        return;
    }

    const current=levels[game.level-1].population;

    const target=next.population;

    const ratio=
        Math.max(
            0,
            Math.min(
                100,
                ((game.population-current)/
                (target-current))*100
            )
        );

    document.getElementById("levelRequirement").innerHTML=
        `다음 단계: <b>Lv.${game.level+1} ${next.name}</b>
        <br>
        필요 인구: ${format(target)}명
        <br>
        현재: ${format(game.population)}명`;

    document.getElementById("levelProgress").style.width=
        ratio+"%";

}

                $${price.toFixed(2)}
            </td>

            <td>
                ${state}
            </td>

        </tr>

        `;

    });

    document.getElementById("marketTable").innerHTML=html;

}


/* =====================================================
   세계 UI
===================================================== */

function updateWorld(){

    let html="";

    game.countries.forEach(c=>{

        html+=`

        <div class="card">

            <h3>
                ${environments[c.environment].emoji}
                ${c.name}
            </h3>

            <p>
                환경: ${c.environment}
            </p>

            <p>
                인구:
                ${format(c.population)}
            </p>

            <p>
                국고:
                $${format(c.money)}
            </p>

        </div>

        `;

    });

    document.getElementById("worldList").innerHTML=
        `<div class="grid">${html}</div>`;

}


/* =====================================================
   로그
===================================================== */

function addLog(text){

    if(!game) return;

    const time=
        `Day ${Math.floor(gameMinutes/60)}`;

    game.logs.unshift(
        `[${time}] ${text}`
    );

    if(game.logs.length>100)
        game.logs.pop();

    const log=
        document.getElementById("log");

    if(log){

        log.innerHTML=
            game.logs
                .map(x=>`<div>${x}</div>`)
                .join("");

    }

}


/* =====================================================
   탭
===================================================== */

function showTab(id){

    document.querySelectorAll(".tab")
        .forEach(x=>x.classList.add("hidden"));

    document.getElementById(id)
        .classList.remove("hidden");

    document.querySelectorAll("nav button")
        .forEach(x=>x.classList.remove("active"));

    const buttons=
        document.querySelectorAll("nav button");

    const names=[
        "overview",
        "resources",
        "build",
        "factory",
        "trade",
        "market",
        "world",
        "logTab"
    ];

    const index=names.indexOf(id);

    if(index>=0)
        buttons[index].classList.add("active");

}


/* =====================================================
   배속
===================================================== */

function setSpeed(value){

    speed=value;

    [1,2,3,4].forEach(v=>{

        document
            .getElementById("speed"+v)
            .classList.toggle(
                "active",
                v===value
            );

    });

}


/* =====================================================
   숫자
===================================================== */

function format(n){

    if(!isFinite(n))
        return "0";

    return Math.floor(n)
        .toLocaleString("ko-KR");

}


/* =====================================================
   시작 시 초기 버튼
===================================================== */

setSpeed(1);

</script>
